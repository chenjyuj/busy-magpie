<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" />
  <meta name="color-scheme" content="dark" />
  <title>Busy Magpie</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <div class="card" id="card">
      <div class="aurora aurora-a"></div>
      <div class="aurora aurora-b"></div>
      <div class="compact-view" id="compactView">
        <div class="drag-bar compact-drag" id="compactDragBar"><span class="drag-grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
        <div class="compact-status"><b>MAGPIE <i id="compactLiveDot"></i></b><span id="compactStatus">连接中</span></div>
        <button class="compact-pill" id="compactPill" type="button" title="单击切换时间窗"><b class="mono" id="compactTotal">—</b><span id="compactPeriod"></span></button>
        <div class="compact-actions"><button id="compactExpand" type="button" aria-label="展开主界面" title="展开主界面">↗</button><button id="compactMenu" type="button" aria-label="操作菜单" title="操作菜单">···</button></div>
      </div>
      <div class="stage-area" id="stageArea">
        <div class="stage-canvas" id="stageCanvas">
          <div class="drag-bar" id="dragBar" title="长按拖动面板">
            <span class="drag-grip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
          </div>

      <button class="token-pill" id="tokenPill" type="button" title="单击切换时间窗" hidden>
        <svg class="token-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 11.5V8.5M8 11.5V5M13 11.5V2.5" />
          <path d="M2.5 13.5h11" class="token-icon-base" />
        </svg>
        <b class="mono token-total" id="tokenTotal"></b>
        <span class="token-window" id="tokenWindow"></span>
      </button>

      <span class="usage-status" id="usageStatus" role="status"></span>

      <div class="gateway">
        <span class="brand">MAGPIE</span>
        <i class="brand-sep"></i>
        <button class="update-chip" id="updateChip" type="button" hidden>更新 <b id="updateChipVersion"></b></button>
        <button class="app-version mono" id="appVersion" type="button" title="关于与更新"><span id="appVersionText">v1.4.0</span><i class="update-dot" id="updateDot" hidden></i></button>
        <button class="quick-menu-toggle" id="quickMenuToggle" type="button" title="操作菜单" aria-label="操作菜单" aria-haspopup="menu" aria-expanded="false" aria-controls="quickMenu">
          <span aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
      </div>

      <div class="quick-menu" id="quickMenu" role="menu" aria-label="挂件操作" hidden>
        <button type="button" role="menuitem" data-menu-action="settings">设置</button>
        <button type="button" role="menuitem" data-menu-action="compact" id="compactMenuItem">紧凑模式</button>
        <button type="button" role="menuitem" data-menu-action="hide">隐藏挂件</button>
        <button type="button" role="menuitem" data-menu-action="pause">暂停显示 1 小时</button>
        <hr role="separator">
        <button type="button" role="menuitem" data-menu-action="about">关于与更新</button>
        <hr role="separator">
        <button type="button" role="menuitem" data-menu-action="quit">退出并停止自动拉起</button>
        <p class="quick-menu-error" id="quickMenuError" role="alert" hidden></p>
      </div>

      <div class="content">
        <header class="topbar">
          <div class="live" id="live">
            <span class="live-dot">
              <i class="halo"></i>
              <i class="core"></i>
            </span>
            <span class="live-word">模型</span>
            <span class="dot-sep">·</span>
            <strong id="liveState">实时</strong>
          </div>
        </header>

        <section class="model-list" id="modelList" aria-label="按实际服务模型分组的最近会话">
          <div class="model-head mono">
            <span class="col-model">模型</span>
            <span class="col-state">状态</span>
            <span class="col-ms">时长</span>
            <span class="col-ttft">首字</span>
            <span class="col-speed">tok/s</span>
          </div>
          <div class="model-rows" id="modelRows"></div>
          <p class="model-empty" id="modelEmpty" hidden>等待 magpie 数据</p>
          <p class="model-hidden mono" id="modelHidden" hidden></p>
        </section>

        <footer class="list-footer">
          <span>网关实时 trace · 本地读取</span>
          <span class="footer-sep"></span>
          <span>鼠标点击穿透</span>
        </footer>
      </div>
        <section class="settings-pane" id="settingsPane" hidden>
          <div class="settings-inner">
            <header class="settings-head">
              <div>
                <b>设置 <em class="settings-version mono" id="settingsVersion">v1.4.0</em></b>
              </div>
              <div class="settings-head-actions">
                <button class="settings-x" id="settingsClose" type="button" aria-label="关闭设置">×</button>
              </div>
            </header>

            <form id="settingsForm" class="settings-form" autocomplete="off">
              <div class="settings-tabs" role="tablist" aria-label="设置分类">
                <button type="button" class="settings-tab" id="settingsTab-appearance" role="tab" aria-controls="settingsPage-appearance" aria-selected="true" tabindex="0" data-settings-page="appearance">外观与动效</button>
                <button type="button" class="settings-tab" id="settingsTab-usage" role="tab" aria-controls="settingsPage-usage" aria-selected="false" tabindex="-1" data-settings-page="usage">用量与更新</button>
                <button type="button" class="settings-tab" id="settingsTab-connection" role="tab" aria-controls="settingsPage-connection" aria-selected="false" tabindex="-1" data-settings-page="connection">连接</button>
              </div>
              <div class="settings-groups">
                <div class="settings-page" id="settingsPage-appearance" role="tabpanel" aria-labelledby="settingsTab-appearance">
                  <section class="settings-group">
                    <div class="settings-duo">
                      <label class="settings-switch">
                        <span><b>总在最前</b></span>
                        <input type="checkbox" id="settingsTopmost">
                      </label>
                      <label class="settings-switch">
                        <span><b>隐藏账号名称</b></span>
                        <input type="checkbox" id="settingsMask">
                      </label>
                    </div>
                    <div class="settings-opacity">
                      <span title="数值越低，背景越透明；文字、按钮和设置页面保持清晰"><b>背景不透明度</b></span>
                      <input type="range" id="settingsOpacity" min="0" max="100" step="1" value="30">
                      <output id="settingsOpacityOut">30%</output>
                    </div>
                    <label class="settings-switch"><span><b>紧凑模式</b></span><input type="checkbox" id="settingsCompact"></label>
                    <label class="settings-switch"><span><b>安静模式</b></span><input type="checkbox" id="settingsQuiet"></label>
                    <div class="gateway-actions"><button type="button" id="settingsResetPosition">恢复默认位置和大小</button></div>
                  </section>

                  <section class="settings-group">
                    <div class="settings-field">
                      <div class="settings-caption"><b>穿过动效</b></div>
                      <div class="settings-chips" id="settingsEffects" role="group" aria-label="穿过动效">
                        <button type="button" class="settings-chip" data-effect="none" aria-pressed="false">无</button>
                        <button type="button" class="settings-chip" data-effect="ripple" aria-pressed="true">涟漪</button>
                        <button type="button" class="settings-chip" data-effect="vortex" aria-pressed="false">漩涡</button>
                        <button type="button" class="settings-chip" data-effect="dissolve" aria-pressed="false">溶解</button>
                        <button type="button" class="settings-chip" data-effect="arc" aria-pressed="false">电弧</button>
                      </div>
                    </div>
                  </section>
                </div>
                <div class="settings-page" id="settingsPage-usage" role="tabpanel" aria-labelledby="settingsTab-usage" hidden>
                  <section class="settings-group">
                    <div class="settings-field">
                      <div class="settings-caption"><b>时间窗</b></div>
                      <div class="settings-chips" id="settingsPeriods" role="group" aria-label="时间窗">
                        <button type="button" class="settings-chip" data-period="today" aria-pressed="true">今日</button>
                        <button type="button" class="settings-chip" data-period="7d" aria-pressed="true">7 天</button>
                        <button type="button" class="settings-chip" data-period="30d" aria-pressed="true">30 天</button>
                        <button type="button" class="settings-chip" data-period="all" aria-pressed="true">全部</button>
                      </div>
                    </div>
                    <div class="settings-field">
                      <div class="settings-caption"><b>数值</b></div>
                      <div class="settings-chips" id="settingsMetrics" role="group" aria-label="胶囊数值">
                        <button type="button" class="settings-chip" data-metric="total" aria-pressed="true">总 token</button>
                        <button type="button" class="settings-chip" data-metric="input" aria-pressed="false">输入</button>
                        <button type="button" class="settings-chip" data-metric="output" aria-pressed="false">输出</button>
                        <button type="button" class="settings-chip" data-metric="cache" aria-pressed="false">缓存读</button>
                      </div>
                    </div>
                    <label class="settings-switch">
                      <span><b>数字滚动</b></span>
                      <input type="checkbox" id="settingsRoll">
                    </label>
                  </section>

                  <section class="settings-group">
                    <div class="settings-duo">
                      <label class="settings-switch">
                        <span><b>额度条</b></span>
                        <input type="checkbox" id="settingsQuota">
                      </label>
                      <label class="settings-switch">
                        <span><b>耗时拆解</b></span>
                        <input type="checkbox" id="settingsTiming">
                      </label>
                    </div>
                    <div class="settings-duo">
                      <div class="settings-chiprow">
                        <span class="settings-chiprow-label"><b>更新</b></span>
                        <div class="settings-chips" id="settingsUpdate" role="group" aria-label="更新方式">
                          <button type="button" class="settings-chip" data-update="idle" aria-pressed="true">空闲</button>
                          <button type="button" class="settings-chip" data-update="notice" aria-pressed="false">提示</button>
                          <button type="button" class="settings-chip" data-update="never" aria-pressed="false">不检查</button>
                        </div>
                      </div>
                      <label class="settings-switch">
                        <span><b>保活</b></span>
                        <input type="checkbox" id="settingsKeepAlive">
                      </label>
                    </div>
                  </section>
                </div>
                <div class="settings-page" id="settingsPage-connection" role="tabpanel" aria-labelledby="settingsTab-connection" hidden>
                  <section class="settings-group">
                    <div class="settings-row">
                      <span><b>网关</b></span>
                      <input type="text" id="settingsGateway" class="settings-input" placeholder="留空自动检测">
                    </div>
                    <div class="gateway-actions"><button type="button" id="gatewayTest">测试连接</button><button type="button" id="gatewayCopy">复制诊断</button></div>
                    <p class="gateway-result" id="gatewayResult" role="status"></p>
                  </section>

                </div>
              </div>

              <footer class="settings-foot">
                <span class="settings-status" id="settingsStatus" role="status"></span>
                <div class="settings-actions">
                  <button type="button" class="settings-ghost" id="settingsCancel">取消</button>
                  <button type="submit" class="settings-save" id="settingsSave">保存</button>
                </div>
              </footer>
            </form>
            <div class="about-view" id="aboutView" hidden>
              <header class="about-head">
                <div class="about-brand">
                  <div class="about-mark" aria-hidden="true"><svg viewBox="0 0 44 44"><path id="aboutBirdPath" fill-rule="evenodd"></path></svg></div>
                  <div class="about-identity"><b>Busy Magpie</b></div>
                </div>
                <button class="settings-x" id="aboutClose" type="button" aria-label="关闭关于页面">×</button>
              </header>

              <div class="about-scroll">
                <section class="about-block about-app">
                  <div class="about-line">
                    <span>桌面应用</span>
                    <span class="about-versions">
                      <b class="mono" id="aboutCurrent">v—</b>
                      <i id="aboutArrow">→</i>
                      <b class="mono accent" id="aboutLatest" hidden></b>
                    </span>
                  </div>
                  <p class="about-status" id="aboutStatus">还没有检查更新。</p>
                  <div class="update-progress" id="updateProgress" hidden>
                    <i id="updateProgressBar"></i>
                  </div>
                  <div class="update-progress-meta mono" id="updateProgressMeta" hidden><span id="updateBytes"></span><span id="updatePercent"></span></div>
                  <div class="about-actions">
                    <button type="button" class="about-primary" id="aboutUpdate" hidden>更新应用</button>
                    <button type="button" class="about-ghost" id="aboutCheck">检查更新</button>
                    <button type="button" class="about-link" id="aboutSkip" hidden>跳过此版本</button>
                    <button type="button" class="about-link" id="aboutRelease" hidden>打开发布页</button>
                  </div>
                </section>

                <section class="about-block about-plugin">
                  <div class="about-line">
                    <span>启动器插件</span>
                    <b class="mono" id="aboutPlugin">v—</b>
                  </div>
                  <p>由 magpie 管理，在 Plugins → Busy Magpie 中点击 Update 更新。</p>
                </section>

                <p class="about-error" id="aboutError" role="status"></p>
              </div>
              <footer class="about-community">
                <div><b>喜欢这个挂件？</b><span>欢迎到 GitHub 点个 Star。</span></div>
                <button type="button" class="about-github" id="aboutGitHub" title="打开 GitHub 仓库">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.4 1.1 6.3-5.6-3-5.6 3 1.1-6.3L3 9.6l6.2-.9Z"/></svg>
                  GitHub · Star <span aria-hidden="true">↗</span>
                </button>
              </footer>
            </div>
          </div>
        </section>
        </div>
      </div>

      <div class="resize-handle resize-n" data-resize="n"></div>
      <div class="resize-handle resize-s" data-resize="s"></div>
      <div class="resize-handle resize-w" data-resize="w"></div>
      <div class="resize-handle resize-e" data-resize="e"></div>
      <div class="resize-handle resize-nw" data-resize="nw"></div>
      <div class="resize-handle resize-ne" data-resize="ne"></div>
      <div class="resize-handle resize-sw" data-resize="sw"></div>
      <div class="resize-handle resize-se" data-resize="se"></div>
    </div>

    <div class="layout-overlay" id="layoutOverlay">
      <div class="layout-copy">
        <b>拖动这张卡片到合适的位置</b>
        <span>按 Esc 完成 · 完成后鼠标点击会继续穿透</span>
      </div>
    </div>
  </div>

  <svg width="0" height="0" class="svg-defs" aria-hidden="true">
    <symbol id="openaiMark" viewBox="0 0 24 24">
      <path id="openaiPath"></path>
    </symbol>
    <symbol id="deepseekMark" viewBox="0 0 24 24">
      <path id="deepseekPath"></path>
    </symbol>
  </svg>

  <script type="module" src="./app.js"></script>
</body>
</html>
